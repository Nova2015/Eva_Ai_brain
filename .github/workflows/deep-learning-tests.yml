name: EVA Foundation Regression Tests

on:
  push:
    branches:
      - feat/engineering-core-foundation
    paths:
      - "src/deep_learning/**"
      - "src/data_governance/**"
      - "src/rag/**"
      - "src/engineering/**"
      - "tests/test_deep_learning_*.py"
      - "tests/test_data_governance_identity.py"
      - "tests/test_data_governance_import_pipeline.py"
      - "tests/test_rag_upload_job_flow.py"
      - "tests/test_graph_rag_store.py"
      - "tests/test_engineering_tool_registry.py tests/test_engineering_job_manager.py tests/test_engineering_workflow_engine.py"
      - "tests/test_engineering_job_manager.py"
      - "tests/test_engineering_workflow_engine.py"
      - ".github/workflows/deep-learning-tests.yml"
  pull_request:
    branches:
      - main
      - feat/engineering-core-foundation
    paths:
      - "src/deep_learning/**"
      - "src/data_governance/**"
      - "src/rag/**"
      - "src/engineering/**"
      - "tests/test_deep_learning_*.py"
      - "tests/test_data_governance_identity.py"
      - "tests/test_data_governance_import_pipeline.py"
      - "tests/test_rag_upload_job_flow.py"
      - "tests/test_graph_rag_store.py"
      - "tests/test_engineering_tool_registry.py"
      - "tests/test_engineering_job_manager.py"
      - "tests/test_engineering_workflow_engine.py"
      - ".github/workflows/deep-learning-tests.yml"

jobs:
  deep-learning-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest numpy openpyxl fastapi python-multipart python-jose[cryptography] xgboost scikit-learn
      - name: Run Deep Learning, Data Governance and RAG tests
        run: python -m pytest -q tests/test_deep_learning_*.py tests/test_data_governance_identity.py tests/test_data_governance_import_pipeline.py tests/test_rag_upload_job_flow.py tests/test_graph_rag_store.py tests/test_engineering_tool_registry.py
