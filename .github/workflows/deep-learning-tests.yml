name: EVA Deep Learning Tests

on:
  push:
    branches:
      - feat/engineering-core-foundation
    paths:
      - "src/deep_learning/**"
      - "src/data_governance/**"
      - "tests/test_deep_learning_*.py"
      - ".github/workflows/deep-learning-tests.yml"
  pull_request:
    branches:
      - main
      - feat/engineering-core-foundation
    paths:
      - "src/deep_learning/**"
      - "src/data_governance/**"
      - "tests/test_deep_learning_*.py"
      - ".github/workflows/deep-learning-tests.yml"

jobs:
  deep-learning-unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install focused test dependencies
        run: python -m pip install --upgrade pip pytest numpy openpyxl fastapi python-multipart xgboost scikit-learn
      - name: Run Deep Learning tests
        run: python -m pytest -q tests/test_deep_learning_*.py tests/test_data_governance_identity.py
