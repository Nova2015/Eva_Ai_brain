[pytest]
# Test boundary for the EVA repository.
#
# eva-ml-service is a SEPARATE deployable — its own repo, its own HuggingFace
# Space, tracked here as a submodule — and it has its own app.py. Collected
# from the repo root it is imported into the same process as src/app.py under
# the same module name, and whichever lands in sys.modules first shadows the
# other:
#
#     import app  ->  D:\Rag project\eva-ml-service\app.py
#
# The cognitive integration tests then exercise the ML service instead of the
# backend and report 25 failures and 12 errors that say nothing true about
# either codebase. The tests are fine; the collection is wrong.
#
# This excludes it from ROOT discovery only. Nothing is deleted or disabled,
# and the service's own suite still runs in its own tree, where its app.py is
# the only one present:
#
#     cd eva-ml-service && pytest
#
# The rest of this list is pytest's own default norecursedirs, restated because
# setting the option replaces the default rather than adding to it — dropping
# them would start collecting build output and virtualenvs.
norecursedirs =
    eva-ml-service
    *.egg
    .*
    _darcs
    build
    CVS
    dist
    node_modules
    venv
    {arch}
